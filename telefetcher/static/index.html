<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>telefetcher</title>
<style>
:root {
  --bg:#f6f7f9; --panel:#fff; --line:#e2e5ea; --text:#1a1d21; --dim:#6b7280;
  --accent:#2481cc; --accent-fg:#fff; --ok:#1a9e5f; --warn:#b45309; --err:#c0392b;
  --row:#fbfcfd; --radius:8px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#16181d; --panel:#1e2127; --line:#2e333c; --text:#e6e8ec; --dim:#9aa3b0;
    --accent:#4a9eda; --accent-fg:#0b0d10; --ok:#3ecf8e; --warn:#e0a33a; --err:#e56a63;
    --row:#22262d;
  }
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--text);
  font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
button, input, select { font:inherit; color:inherit; }
button {
  background:var(--panel); border:1px solid var(--line); border-radius:6px;
  padding:6px 12px; cursor:pointer;
}
button:hover:not(:disabled) { border-color:var(--accent); }
button:disabled { opacity:.45; cursor:default; }
button.primary { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
input[type=text], input[type=number], select {
  background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:6px 9px;
}
header {
  display:flex; align-items:center; gap:12px; padding:10px 16px;
  background:var(--panel); border-bottom:1px solid var(--line);
}
header h1 { font-size:15px; margin:0; font-weight:650; letter-spacing:-.01em; }
header .who { color:var(--dim); font-size:12.5px; margin-left:auto; text-align:right; }
main { display:grid; grid-template-columns:290px 1fr; height:calc(100vh - 49px); }
aside { border-right:1px solid var(--line); overflow:auto; background:var(--panel); }
aside .search { padding:10px; position:sticky; top:0; background:var(--panel); border-bottom:1px solid var(--line); }
aside .search input { width:100%; }
.chat {
  padding:9px 12px; border-bottom:1px solid var(--line); cursor:pointer; display:flex;
  flex-direction:column; gap:2px;
}
.chat:hover { background:var(--row); }
.chat.sel { background:var(--row); box-shadow:inset 3px 0 0 var(--accent); }
.chat .name { font-weight:550; }
.chat .meta { color:var(--dim); font-size:12px; display:flex; gap:6px; }
.tag { font-size:11px; padding:0 5px; border-radius:4px; border:1px solid var(--line); }
.tag.lock { color:var(--warn); border-color:var(--warn); }
section { overflow:auto; padding:16px; }
.bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
.bar label { color:var(--dim); font-size:12.5px; display:flex; gap:5px; align-items:center; }
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:7px 9px; border-bottom:1px solid var(--line); }
th { color:var(--dim); font-size:12px; font-weight:600; position:sticky; top:0; background:var(--bg); }
tbody tr:hover { background:var(--row); }
td.num { text-align:right; font-variant-numeric:tabular-nums; color:var(--dim); }
td.name { word-break:break-word; }
.have { color:var(--ok); font-size:12px; }
.tabs { display:flex; gap:4px; margin-bottom:14px; border-bottom:1px solid var(--line); }
.tabs button { border:none; background:none; border-bottom:2px solid transparent; border-radius:0; padding:7px 12px; }
.tabs button.on { border-bottom-color:var(--accent); color:var(--accent); font-weight:600; }
.job { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:11px 13px; margin-bottom:10px; }
.job h3 { margin:0 0 4px; font-size:13.5px; }
.job .sub { color:var(--dim); font-size:12px; margin-bottom:8px; display:flex; gap:10px; flex-wrap:wrap; }
.track { height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
.track > div { height:100%; background:var(--accent); transition:width .3s; }
.job .files { margin-top:9px; max-height:190px; overflow:auto; font-size:12.5px; }
.job .files div { display:flex; gap:8px; padding:2px 0; }
.job .files .f { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.status-done { color:var(--ok); } .status-failed { color:var(--err); }
.status-skipped { color:var(--dim); } .status-downloading { color:var(--accent); }
.empty { color:var(--dim); padding:36px 0; text-align:center; }
.toast {
  position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:9;
  background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--err);
  padding:9px 14px; border-radius:6px; box-shadow:0 4px 18px rgba(0,0,0,.18); max-width:70vw;
}
#login { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center;
  justify-content:center; z-index:20; padding:20px; }
#login .card { background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:26px 28px; width:100%; max-width:400px; box-shadow:0 10px 40px rgba(0,0,0,.12); }
#login h2 { margin:0 0 4px; font-size:17px; }
#login p.lede { margin:0 0 18px; color:var(--dim); font-size:13px; }
#login label { display:block; font-size:12.5px; color:var(--dim); margin:12px 0 4px; }
#login input { width:100%; padding:9px 11px; font-size:15px; }
#login .actions { display:flex; gap:8px; align-items:center; margin-top:18px; }
#login .actions button.primary { flex:1; padding:9px; }
#login .err { color:var(--err); font-size:12.5px; margin-top:12px; min-height:1em; }
#login a { color:var(--accent); }
#login .back { background:none; border:none; color:var(--dim); padding:4px; font-size:12.5px;
  text-decoration:underline; cursor:pointer; }
#login .steps { display:flex; gap:5px; margin-bottom:16px; }
#login .steps i { height:3px; flex:1; background:var(--line); border-radius:2px; }
#login .steps i.on { background:var(--accent); }
.spin { display:inline-block; width:11px; height:11px; border:2px solid var(--line);
  border-top-color:var(--accent); border-radius:50%; animation:s .7s linear infinite; }
@keyframes s { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="login" hidden><div class="card" id="loginCard"></div></div>
<header>
  <h1>telefetcher</h1>
  <span id="scanning" hidden><span class="spin"></span></span>
  <div class="who" id="who">connecting…</div>
  <button id="signout" hidden style="padding:4px 10px;font-size:12.5px">Sign out</button>
</header>
<main>
  <aside>
    <div class="search"><input type="text" id="chatSearch" placeholder="Search your chats…" autocomplete="off"></div>
    <div id="chats"><div class="empty">loading…</div></div>
  </aside>
  <section>
    <div class="tabs">
      <button data-tab="videos" class="on">Videos</button>
      <button data-tab="jobs">Downloads <span id="jobCount"></span></button>
      <button data-tab="files">Files</button>
    </div>

    <div id="tab-videos">
      <div class="bar">
        <label>show <input type="number" id="limit" value="200" min="1" max="5000" style="width:76px"></label>
        <label><input type="checkbox" id="gifs"> gifs</label>
        <label><input type="checkbox" id="notes"> video notes</label>
        <label>min size <input type="text" id="minSize" placeholder="0" style="width:70px"></label>
        <label>text <input type="text" id="search" placeholder="caption…" style="width:130px"></label>
        <button id="rescan">Scan</button>
        <span style="flex:1"></span>
        <label>workers <input type="number" id="workers" value="2" min="1" max="8" style="width:60px"></label>
        <button class="primary" id="grab" disabled>Download selected</button>
      </div>
      <div id="videos"><div class="empty">Pick a chat on the left.</div></div>
    </div>

    <div id="tab-jobs" hidden>
      <div class="bar"><button id="clearJobs">Clear finished</button></div>
      <div id="jobs"><div class="empty">No downloads yet.</div></div>
    </div>

    <div id="tab-files" hidden>
      <div class="bar"><button id="refreshFiles">Refresh</button><span id="filesTotal" style="color:var(--dim)"></span></div>
      <div id="files"><div class="empty">Nothing downloaded yet.</div></div>
    </div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const el = (t, a = {}, ...kids) => {
  const n = document.createElement(t);
  for (const [k, v] of Object.entries(a)) {
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== false) n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) n.append(kid);
  return n;
};
const fmtSize = b => {
  if (!b) return '—';
  const u = ['B','KB','MB','GB','TB']; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return (i ? b.toFixed(1) : b) + u[i];
};
const fmtDur = s => {
  if (!s) return '—';
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = Math.floor(s%60);
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}` : `${m}:${String(x).padStart(2,'0')}`;
};
let toastTimer;
function toast(msg) {
  document.querySelector('.toast')?.remove();
  const t = el('div', { class: 'toast' }, msg);
  document.body.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 6000);
}
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) { toast(await r.text() || r.statusText); throw new Error(r.statusText); }
  return r.json();
}
const post = (path, body) =>
  api(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) });

let chats = [], current = null, items = [], picked = new Set();

// ---- chats ----
async function loadChats(q = '') {
  chats = await api('/api/chats?q=' + encodeURIComponent(q));
  const box = $('#chats');
  box.replaceChildren();
  if (!chats.length) { box.append(el('div', { class: 'empty' }, 'no chats match')); return; }
  for (const c of chats) {
    box.append(el('div', {
      class: 'chat' + (current === c.id ? ' sel' : ''),
      onclick: () => selectChat(c),
    },
      el('div', { class: 'name' }, c.name),
      el('div', { class: 'meta' },
        el('span', { class: 'tag' }, c.kind),
        c.private ? el('span', { class: 'tag' }, 'private') : null,
        c.protected ? el('span', { class: 'tag lock' }, 'protected') : null,
      )));
  }
}
function selectChat(c) {
  current = c.id;
  loadChats($('#chatSearch').value);
  scan();
}

// ---- scan ----
async function scan() {
  if (current == null) return;
  $('#scanning').hidden = false;
  $('#videos').replaceChildren(el('div', { class: 'empty' }, 'scanning…'));
  try {
    const body = {
      chat_id: current,
      limit: +$('#limit').value || 200,
      gifs: $('#gifs').checked,
      notes: $('#notes').checked,
      search: $('#search').value.trim(),
      min_size: parseSize($('#minSize').value),
    };
    const res = await post('/api/scan', body);
    items = res.items; picked = new Set();
    renderVideos(res);
  } catch (e) { $('#videos').replaceChildren(el('div', { class: 'empty' }, 'scan failed')); }
  finally { $('#scanning').hidden = true; }
}
function parseSize(v) {
  const m = /^\s*([\d.]+)\s*([kmgt]?)b?\s*$/i.exec(v || '');
  if (!m) return 0;
  return Math.round(parseFloat(m[1]) * ({ '':1, k:1024, m:1048576, g:1073741824, t:1099511627776 })[m[2].toLowerCase()]);
}
function renderVideos(res) {
  const box = $('#videos');
  box.replaceChildren();
  if (!items.length) { box.append(el('div', { class: 'empty' }, 'No videos found with these filters.')); syncGrab(); return; }
  const head = el('tr', {},
    el('th', {}, el('input', { type: 'checkbox', id: 'all', onchange: e => {
      picked = e.target.checked ? new Set(items.filter(i => !i.have).map(i => i.msg_id)) : new Set();
      renderVideos(res);
    } })),
    el('th', {}, 'msg'), el('th', {}, 'name'),
    el('th', {}, 'size'), el('th', {}, 'length'), el('th', {}, ''));
  const rows = items.map(i => el('tr', {},
    el('td', {}, el('input', {
      type: 'checkbox', ...(picked.has(i.msg_id) ? { checked: 'checked' } : {}),
      onchange: e => { e.target.checked ? picked.add(i.msg_id) : picked.delete(i.msg_id); syncGrab(); },
    })),
    el('td', { class: 'num' }, String(i.msg_id)),
    el('td', { class: 'name' }, i.filename),
    el('td', { class: 'num' }, fmtSize(i.size)),
    el('td', { class: 'num' }, fmtDur(i.duration)),
    el('td', {}, i.have ? el('span', { class: 'have' }, '✓ have') : '')));
  box.append(
    el('div', { style: 'color:var(--dim);margin-bottom:8px' },
      `${res.title} — ${items.length} video(s) · saving to ${res.out_dir}`),
    el('table', {}, el('thead', {}, head), el('tbody', {}, rows)));
  syncGrab();
}
const syncGrab = () => {
  $('#grab').disabled = picked.size === 0;
  $('#grab').textContent = picked.size ? `Download ${picked.size} selected` : 'Download selected';
};

// ---- jobs ----
async function refreshJobs() {
  const jobs = await api('/api/jobs');
  const running = jobs.filter(j => j.status === 'running').length;
  $('#jobCount').textContent = running ? `(${running})` : '';
  const box = $('#jobs');
  box.replaceChildren();
  if (!jobs.length) { box.append(el('div', { class: 'empty' }, 'No downloads yet.')); return running; }
  for (const j of jobs.slice().reverse()) {
    const pct = j.bytes_total ? Math.min(100, j.bytes_done / j.bytes_total * 100) : 0;
    box.append(el('div', { class: 'job' },
      el('h3', {}, j.chat_title),
      el('div', { class: 'sub' },
        el('span', {}, `${j.finished}/${j.total} files`),
        el('span', {}, `${fmtSize(j.bytes_done)} / ${fmtSize(j.bytes_total)}`),
        el('span', { class: 'status-' + j.status }, j.status),
        j.failed ? el('span', { class: 'status-failed' }, `${j.failed} failed`) : null,
        j.error ? el('span', { class: 'status-failed' }, j.error) : null,
        j.status === 'running'
          ? el('button', { style: 'padding:1px 8px;font-size:12px',
              onclick: () => post(`/api/jobs/${j.id}/cancel`).then(refreshJobs) }, 'Cancel')
          : null),
      el('div', { class: 'track' }, el('div', { style: `width:${pct}%` })),
      el('div', { class: 'files' }, j.files.map(f => el('div', {},
        el('span', { class: 'f' }, f.filename),
        el('span', { class: 'status-' + f.status },
          f.status === 'downloading' ? `${fmtSize(f.done)} / ${fmtSize(f.size)}` : f.status))))));
  }
  return running;
}

// ---- files ----
async function loadFiles() {
  const rows = await api('/api/files');
  const box = $('#files');
  box.replaceChildren();
  $('#filesTotal').textContent = rows.length
    ? `${rows.length} file(s) · ${fmtSize(rows.reduce((a, r) => a + r.size, 0))}` : '';
  if (!rows.length) { box.append(el('div', { class: 'empty' }, 'Nothing downloaded yet.')); return; }
  box.append(el('table', {},
    el('thead', {}, el('tr', {}, el('th', {}, 'file'), el('th', {}, 'folder'),
      el('th', {}, 'size'), el('th', {}, 'saved'), el('th', {}, ''))),
    el('tbody', {}, rows.map(r => el('tr', {},
      el('td', { class: 'name' }, r.name),
      el('td', { class: 'num' }, r.folder),
      el('td', { class: 'num' }, fmtSize(r.size)),
      el('td', { class: 'num' }, new Date(r.mtime * 1000).toLocaleString()),
      el('td', {},
        el('button', { style: 'padding:1px 8px;font-size:12px',
          onclick: () => post('/api/files/reveal', { path: r.path }) }, 'Show'),
        ' ',
        el('button', { style: 'padding:1px 8px;font-size:12px',
          onclick: async () => {
            if (!confirm(`Delete ${r.name}?`)) return;
            await post('/api/files/delete', { path: r.path });
            loadFiles();
          } }, 'Delete')))))));
}

// ---- wiring ----
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  for (const t of ['videos', 'jobs', 'files']) $('#tab-' + t).hidden = t !== b.dataset.tab;
  if (b.dataset.tab === 'files') loadFiles();
  if (b.dataset.tab === 'jobs') refreshJobs();
});
let searchTimer;
$('#chatSearch').oninput = e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => loadChats(e.target.value), 220);
};
$('#rescan').onclick = scan;
$('#refreshFiles').onclick = loadFiles;
$('#clearJobs').onclick = () => post('/api/jobs/clear').then(refreshJobs);
$('#grab').onclick = async () => {
  const n = picked.size;
  await post('/api/download', { chat_id: current, msg_ids: [...picked], workers: +$('#workers').value || 2 });
  picked = new Set(); syncGrab();
  document.querySelector('.tabs button[data-tab=jobs]').click();
  toast(`queued ${n} file(s)`);
};

// ---- login ----
const STEPS = ['credentials', 'phone', 'code', 'password'];
let busy = false;

async function authPost(path, body) {
  const r = await fetch(path, {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
  });
  const text = await r.text();
  if (!r.ok) throw new Error(text || r.statusText);
  return JSON.parse(text);
}

function renderLogin(step, err = '') {
  const card = $('#loginCard');
  const idx = STEPS.indexOf(step);
  const dots = el('div', { class: 'steps' }, STEPS.map((_, i) =>
    el('i', { class: i <= idx ? 'on' : '' })));
  const error = el('div', { class: 'err' }, err);

  const submit = async (fn) => {
    if (busy) return;
    busy = true;
    error.textContent = '';
    try {
      const res = await fn();
      busy = false;
      if (res.step === 'ready') return startApp();
      renderLogin(res.step);
    } catch (e) {
      busy = false;
      renderLogin(step, e.message);
    }
  };

  const form = (title, lede, fields, onSubmit, extra) => {
    const inputs = fields.map(f => {
      const input = el('input', {
        type: f.type || 'text', id: 'li_' + f.key,
        placeholder: f.placeholder || '', autocomplete: f.autocomplete || 'off',
      });
      return { field: f, input, node: el('div', {}, el('label', {}, f.label), input) };
    });
    const go = () => onSubmit(Object.fromEntries(inputs.map(i => [i.field.key, i.input.value])));
    inputs.forEach(i => i.input.addEventListener('keydown', e => { if (e.key === 'Enter') go(); }));
    card.replaceChildren(
      dots, el('h2', {}, title), el('p', { class: 'lede' }, lede),
      ...inputs.map(i => i.node), error,
      el('div', { class: 'actions' },
        el('button', { class: 'primary', onclick: go }, 'Continue'), extra || null));
    setTimeout(() => inputs[0]?.input.focus(), 30);
  };

  if (step === 'credentials') {
    const card2 = el('span', {}, 'Get these from ',
      el('a', { href: 'https://my.telegram.org', target: '_blank' }, 'my.telegram.org'),
      ' → API development tools. They identify the app, not your account.');
    form('Connect your Telegram app', '', [
      { key: 'api_id', label: 'api_id', placeholder: '1234567' },
      { key: 'api_hash', label: 'api_hash', placeholder: '0123456789abcdef…' },
    ], v => submit(() => authPost('/api/auth/credentials', v)));
    card.querySelector('p.lede').replaceChildren(card2);
  } else if (step === 'phone') {
    form('Sign in', 'Telegram will send a code to this number.', [
      { key: 'phone', label: 'Phone number', placeholder: '+15551234567', autocomplete: 'tel' },
    ], v => submit(() => authPost('/api/auth/phone', v)));
  } else if (step === 'code') {
    form('Enter the code', 'Check your other Telegram apps for the login code.', [
      { key: 'code', label: 'Login code', placeholder: '12345' },
    ], v => submit(() => authPost('/api/auth/code', v)),
      el('button', { class: 'back', onclick: () => renderLogin('phone') }, 'Use another number'));
  } else if (step === 'password') {
    form('Two-step verification', 'This account has a password set.', [
      { key: 'password', label: 'Password', type: 'password', autocomplete: 'current-password' },
    ], v => submit(() => authPost('/api/auth/password', v)));
  }
  $('#login').hidden = false;
}

let ticker = null;
async function startApp() {
  const s = await api('/api/auth/status');
  if (s.step !== 'ready') return renderLogin(s.step);
  $('#login').hidden = true;
  $('#signout').hidden = false;
  $('#who').textContent =
    `${s.me.name}${s.me.username ? ' @' + s.me.username : ''} · ${s.root}`;
  await loadChats();
  if (ticker) clearInterval(ticker);
  ticker = setInterval(async () => {
    const running = await refreshJobs().catch(() => 0);
    if (running === 0 && !$('#tab-files').hidden) loadFiles();
  }, 900);
}

$('#signout').onclick = async () => {
  if (!confirm('Sign out and delete the saved session on this machine?')) return;
  if (ticker) { clearInterval(ticker); ticker = null; }
  const res = await post('/api/auth/logout');
  chats = []; items = []; picked = new Set(); current = null;
  $('#chats').replaceChildren();
  $('#videos').replaceChildren(el('div', { class: 'empty' }, 'Pick a chat on the left.'));
  $('#signout').hidden = true;
  $('#who').textContent = 'signed out';
  renderLogin(res.step);
};

startApp();
</script>
</body>
</html>
